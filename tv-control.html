<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' https: data: blob:; media-src 'self' https: blob:; connect-src 'self' https: wss://*.firebaseio.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>TV Control</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+Malayalam:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>body{font-family:Inter,'Noto Sans Malayalam',sans-serif;background:#f8fafc}.glass{background:rgba(255,255,255,.86);backdrop-filter:blur(16px)}.mode-card input:checked+span{border-color:#4f46e5;background:#eef2ff;color:#3730a3}.result-card:has(input:checked){border-color:#4f46e5;background:#eef2ff}</style>
</head>
<body class="min-h-screen text-slate-900">
  <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/90 backdrop-blur"><div class="mx-auto flex max-w-7xl flex-col gap-3 px-4 py-4 md:flex-row md:items-center md:justify-between"><div><p class="text-[10px] font-black uppercase tracking-[0.3em] text-indigo-600">Admin Control</p><h1 class="text-2xl font-black">TV Control Room</h1><p class="text-xs font-bold text-slate-500">Select exactly what TV should play: results, team scores, media, or video-only takeover.</p></div><div class="flex flex-wrap gap-2"><a href="admin.html#tv-display" class="rounded-xl border px-4 py-2 text-xs font-black text-slate-700">Back to Admin</a><a href="tv.html" target="_blank" class="rounded-xl bg-slate-900 px-4 py-2 text-xs font-black text-white">Open TV</a><button id="apply-control" onclick="saveTVControl()" class="rounded-xl bg-indigo-600 px-5 py-2 text-xs font-black text-white shadow-lg shadow-indigo-500/20">Apply to TV</button></div></div></header>
  <main class="mx-auto grid max-w-7xl gap-4 px-4 py-5 lg:grid-cols-[360px_1fr]">
    <aside class="space-y-4">
      <section class="rounded-3xl border bg-white p-4 shadow-sm"><h2 class="font-black">Display Mode</h2><div class="mt-3 grid gap-2">
        <label class="mode-card"><input type="radio" name="mode" value="results" class="hidden" checked><span class="block rounded-2xl border p-3 text-sm font-black">Results Sequence <small class="block font-bold text-slate-500">Selected published results + final team score</small></span></label>
        <label class="mode-card"><input type="radio" name="mode" value="video-only" class="hidden"><span class="block rounded-2xl border p-3 text-sm font-black">Video Only <small class="block font-bold text-slate-500">No title, ticker, overlay, or background content</small></span></label>
        <label class="mode-card"><input type="radio" name="mode" value="media" class="hidden"><span class="block rounded-2xl border p-3 text-sm font-black">Media Wall <small class="block font-bold text-slate-500">Images/videos/announcements only</small></span></label>
        <label class="mode-card"><input type="radio" name="mode" value="dashboard" class="hidden"><span class="block rounded-2xl border p-3 text-sm font-black">Dashboard Auto <small class="block font-bold text-slate-500">Normal live TV rotation</small></span></label>
      </div></section>
      <section class="rounded-3xl border bg-white p-4 shadow-sm"><h2 class="font-black">Animation Style</h2><select id="animation-style" class="mt-3 w-full rounded-xl border p-3 text-sm font-bold"><option value="cinematic">Cinematic Reveal</option><option value="spotlight">Spotlight Winner</option><option value="ticker-rise">Ticker Rise</option><option value="confetti">Celebration Confetti</option></select><label class="mt-3 block text-xs font-black uppercase text-slate-500">Result order<select id="result-order" class="mt-1 w-full rounded-xl border p-3 text-sm font-bold normal-case"><option value="selected">Selected order</option><option value="latest">Latest first</option><option value="oldest">Oldest first</option></select></label></section>
      <section class="rounded-3xl border bg-white p-4 shadow-sm"><h2 class="font-black">Video / Media Takeover</h2><label class="mt-3 block text-xs font-black uppercase text-slate-500">Video URL<textarea id="control-video-url" rows="3" class="mt-1 w-full rounded-xl border p-3 text-sm font-semibold" placeholder="MP4/WebM or YouTube URL"></textarea></label><label class="mt-3 block text-xs font-black uppercase text-slate-500">Image URLs<textarea id="control-image-urls" rows="4" class="mt-1 w-full rounded-xl border p-3 text-sm font-semibold" placeholder="One image URL per line"></textarea></label></section>
    </aside>
    <section class="space-y-4"><div class="rounded-3xl border bg-white p-4 shadow-sm"><div class="flex flex-wrap items-center justify-between gap-3"><div><h2 class="text-xl font-black">Published Results</h2><p class="text-xs font-bold text-slate-500">Choose one or more events to push to TV.</p></div><div class="flex gap-2"><button onclick="setAllResults(true)" class="rounded-xl bg-indigo-50 px-3 py-2 text-xs font-black text-indigo-700">Select All</button><button onclick="setAllResults(false)" class="rounded-xl border px-3 py-2 text-xs font-black text-slate-600">Clear</button></div></div><div id="published-results" class="mt-4 grid gap-3 md:grid-cols-2 xl:grid-cols-3"></div></div><div id="preview" class="rounded-3xl border bg-slate-950 p-5 text-white shadow-sm"></div></section>
  </main>
  <div id="toast" class="fixed bottom-5 left-1/2 hidden -translate-x-1/2 rounded-xl bg-slate-900 px-4 py-3 text-sm font-black text-white shadow-2xl"></div>
  <script type="module">
    import { db, auth } from './firebase-config.js';
    import { collection, doc, getDoc, onSnapshot, setDoc } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';
    import { onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';
    let results=[],events=[],students=[],teamDisplayNames={},tvControl={};
    const h=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const lines=id=>(document.getElementById(id)?.value||'').split('\n').map(v=>v.trim()).filter(Boolean);
    const teamName=t=>teamDisplayNames?.[t]||t||'Team';
    const eventName=r=>events.find(e=>e.id===r.eventId)?.name||r.eventName||'Event';
    const person=id=>students.find(s=>s.id===id)||{};
    const winners=r=>(r.places||[]).flatMap(place=>(place.winners||[]).map(id=>({place:place.label||'Place',points:place.earnedValue??place.value??0,student:person(id),raw:id})));
    const toast=msg=>{const el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2500)};
    function hydrate(){document.querySelector(`input[name="mode"][value="${tvControl.mode||'results'}"]`)?.click();document.getElementById('animation-style').value=tvControl.animationStyle||'cinematic';document.getElementById('result-order').value=tvControl.resultOrder||'selected';document.getElementById('control-video-url').value=tvControl.videoUrl||'';document.getElementById('control-image-urls').value=(tvControl.imageUrls||[]).join('\n');render();}
    window.setAllResults=checked=>{document.querySelectorAll('[data-result-check]').forEach(cb=>cb.checked=checked);renderPreview()};
    window.saveTVControl=async()=>{const selected=[...document.querySelectorAll('[data-result-check]:checked')].map(cb=>cb.value);const payload={mode:document.querySelector('input[name="mode"]:checked')?.value||'results',animationStyle:document.getElementById('animation-style').value,resultOrder:document.getElementById('result-order').value,selectedResultIds:selected,videoUrl:document.getElementById('control-video-url').value.trim(),imageUrls:lines('control-image-urls'),updatedAt:Date.now(),updatedByUid:auth.currentUser?.uid||''};await setDoc(doc(db,'settings','tv_control'),payload,{merge:true});toast('TV control applied')};
    function render(){const selected=new Set(tvControl.selectedResultIds||[]);document.getElementById('published-results').innerHTML=results.map(r=>`<label class="result-card block rounded-2xl border bg-white p-3 shadow-sm"><div class="flex items-start gap-3"><input data-result-check type="checkbox" value="${h(r.eventId)}" ${selected.has(r.eventId)?'checked':''} onchange="renderPreview()" class="mt-1 h-5 w-5"><div><h3 class="font-black">${h(eventName(r))}</h3><p class="text-[10px] font-bold uppercase text-slate-400">${h(r.category||'')} • ${h(r.gender||'Both')}</p><p class="mt-2 text-xs font-bold text-indigo-700">${winners(r).slice(0,3).map(w=>`${h(w.place)}: ${h(w.student.name||w.raw)}`).join(' • ')||'No winners'}</p></div></div></label>`).join('')||'<p class="rounded-2xl border border-dashed p-8 text-center text-sm font-bold text-slate-400">No published results yet.</p>';renderPreview();lucide.createIcons()}
    window.renderPreview=function renderPreview(){const selected=[...document.querySelectorAll('[data-result-check]:checked')].map(cb=>results.find(r=>r.eventId===cb.value)).filter(Boolean);const mode=document.querySelector('input[name="mode"]:checked')?.value||'results';document.getElementById('preview').innerHTML=`<p class="text-[10px] font-black uppercase tracking-[0.3em] text-indigo-300">TV Preview Plan</p><h2 class="mt-2 text-2xl font-black">${h(mode)} • ${h(document.getElementById('animation-style').value)}</h2><div class="mt-4 grid gap-2">${selected.map(r=>`<div class="rounded-xl bg-white/10 p-3"><b>${h(eventName(r))}</b><p class="text-xs text-white/60">${winners(r).length} winner row(s), then team score animation</p></div>`).join('')||'<p class="text-white/50">Select results or choose media/video mode.</p>'}</div>`};
    onAuthStateChanged(auth,async user=>{if(!user) location.replace('login.html?next=tv-control.html'); const snap=await getDoc(doc(db,'adminUsers',user.uid)); if(!snap.exists()||snap.data().active!==true||!['admin','superAdmin'].includes(snap.data().role)){await signOut(auth);location.replace('login.html?next=tv-control.html');return;} onSnapshot(collection(db,'results'),s=>{results=s.docs.map(d=>({eventId:d.id,...d.data()})).filter(r=>(r.status||'published')==='published').sort((a,b)=>(b.publishedAt||b.timestamp||0)-(a.publishedAt||a.timestamp||0));render()}); onSnapshot(collection(db,'events'),s=>{events=s.docs.map(d=>({id:d.id,...d.data()}));render()}); onSnapshot(collection(db,'students'),s=>{students=s.docs.map(d=>({id:d.id,...d.data()}));render()}); onSnapshot(doc(db,'settings','general'),s=>{teamDisplayNames=s.data()?.teamDisplayNames||{};render()}); onSnapshot(doc(db,'settings','tv_control'),s=>{tvControl=s.data()||{};hydrate()});});
    document.addEventListener('change',e=>{if(e.target.matches('input[name="mode"],#animation-style,#result-order'))renderPreview()});
  </script>
</body>
</html>
