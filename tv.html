<!DOCTYPE html>
<html lang="en">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' https: data: blob:; media-src 'self' https: blob:; connect-src 'self' https: wss://*.firebaseio.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; upgrade-insecure-requests">

  <title>Fest TV Display</title>

  <style>
    html, body { touch-action: pan-x pan-y pinch-zoom; overscroll-behavior: auto; }

    .fullscreen-shell:fullscreen { background:#020617; }
    .fullscreen-shell:-webkit-full-screen { background:#020617; }
    .fullscreen-control { opacity:0; pointer-events:none; transform:translate(-50%,-10px); transition: opacity .2s ease, transform .2s ease; }
    .fullscreen-control-zone:hover .fullscreen-control, .fullscreen-control-zone:focus-within .fullscreen-control { opacity:1; pointer-events:auto; transform:translate(-50%,0); }
    .fullscreen-control[data-active="true"] { background: rgba(16,185,129,.9); }
    @keyframes sceneIn{from{opacity:0;transform:scale(.97) translateY(24px)}to{opacity:1;transform:none}}@keyframes spotlight{from{opacity:0;filter:blur(12px);transform:scale(1.1)}to{opacity:1;filter:none;transform:none}}@keyframes tickerRise{from{opacity:0;transform:translateY(80px)}to{opacity:1;transform:none}}@keyframes confettiPop{0%{opacity:0;transform:scale(.6) rotate(-3deg)}70%{transform:scale(1.04) rotate(1deg)}100%{opacity:1;transform:none}}@keyframes scorePulse{50%{transform:scale(1.08);color:#fde047}}.scene-in{animation:sceneIn .55s ease-out both}.scene-spotlight{animation:spotlight .75s ease-out both}.scene-ticker-rise{animation:tickerRise .65s cubic-bezier(.2,.9,.2,1) both}.scene-confetti{animation:confettiPop .8s ease-out both}.score-pulse{animation:scorePulse .7s ease-in-out}.glass { background: rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.16); backdrop-filter: blur(10px); }
    .tv-section-hidden{display:none!important}.tv-pos-left{margin-right:auto}.tv-pos-center{margin-left:auto;margin-right:auto;text-align:center}.tv-pos-right{margin-left:auto;text-align:right}[data-tv-compact="true"]{overflow:hidden}[data-tv-compact="true"] h2{font-size:clamp(1.8rem,3.6vw,3.4rem)!important}[data-tv-compact="true"] h3{font-size:clamp(1.8rem,4vw,3.8rem)!important}[data-tv-compact="true"] p{font-size:clamp(.9rem,1.8vw,1.5rem)!important}[data-tv-compact="true"] .text-7xl{font-size:clamp(2.5rem,5vw,4rem)!important}
  </style>
</head>
<body class="h-screen">
  <div id="fullscreen-shell" class="fullscreen-shell fixed inset-0 overflow-hidden bg-slate-950">
  <div id="bg" class="fixed inset-0 bg-gradient-to-br from-indigo-950 to-black"></div>
  <video id="bg-video" class="fixed inset-0 h-full w-full object-cover hidden opacity-50" autoplay muted playsinline></video><iframe id="bg-youtube" class="pointer-events-none fixed inset-0 hidden h-full w-full scale-[1.2] opacity-50" title="YouTube background video" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <div id="tv-overlay" class="fixed inset-0 bg-black/35"></div>

  <main class="relative z-10 h-screen flex flex-col p-10">
    <header id="tv-header" class="mb-8 flex flex-wrap items-center gap-5">
      <div id="tv-logo-section" class="h-20 w-20 overflow-hidden rounded-2xl border border-white/20 bg-white/10"><img id="tv-fest-logo" class="hidden h-full w-full object-cover" alt="Fest logo"><span id="tv-logo-fallback" class="flex h-full w-full items-center justify-center text-xl font-black">FM</span></div>
      <div id="tv-name-section" class="min-w-0">
        <h1 id="tv-title" class="text-6xl font-black tracking-tight">FEST LIVE</h1>
        <p id="tv-subtitle" class="text-white/60 text-xl font-bold mt-2">Live results, standings and announcements</p>
      </div>
      <div id="clock" class="text-4xl font-black glass rounded-3xl px-8 py-5"></div>
    </header>

    <section id="main-grid" class="grid min-h-0 flex-1 auto-rows-fr grid-cols-12 gap-6 overflow-y-auto pr-1"></section>

    <div id="live-scene" class="fixed inset-0 z-40 hidden items-center justify-center bg-slate-950/95 p-10"></div>
    <div id="queue-status" class="fixed right-10 top-10 z-50 hidden rounded-full bg-red-600 px-5 py-2 text-lg font-black shadow-2xl"></div>
    <footer id="tv-ticker-section" class="h-20 mt-8 bg-red-700 overflow-hidden flex items-center rounded-2xl border border-white/10">
      <div id="ticker" class="ticker whitespace-nowrap text-3xl font-black uppercase tracking-wider pl-[100%]">Welcome to Fest Live</div>
    </footer>
  </main>

  <div class="fullscreen-control-zone fixed left-1/2 top-0 z-[70] h-20 w-96 -translate-x-1/2" aria-label="Fullscreen control area"><button id="fullscreen-toggle" type="button" class="fullscreen-control absolute left-1/2 top-3 rounded-full border border-white/20 bg-slate-950/80 px-5 py-3 text-sm font-black uppercase tracking-wide text-white shadow-2xl backdrop-blur" aria-pressed="false" title="Move the mouse to the top center, then click to hide browser bars while casting to TV">⛶ Full Screen</button></div>
  <div id="fullscreen-hint" class="pointer-events-none fixed left-1/2 top-20 z-[70] hidden -translate-x-1/2 rounded-full bg-amber-400 px-5 py-2 text-sm font-black text-slate-950 shadow-2xl">Allow full screen from the browser prompt</div>
  </div>

  <script type="module">
    import { db, auth } from './firebase-config.js';
    import { eventContributesToTeamScore, normalizeFestSetup } from './fest-config.js';
    import { normalizeBranding, brandingName, applyBase64Image } from './branding-config.js';
    import { collection, onSnapshot, doc, query, where } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';
    import { signInAnonymously } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';

    let tvConfig = {}, tvControl = {}, homeBranding=normalizeBranding(), results = [], events = [], students = [], participants = [], registrations = [], teams = [], teamDisplayNames = {}, festSetup = normalizeFestSetup(),resultQueue=[],presenting=false,resultsReady=false,knownPublished=new Set(),previousScoreMap={},lastDashboardHash='',slideIndex=0;
    const defaults = () => ({ title:homeBranding.configured?`${brandingName(homeBranding)} LIVE`:'FEST MANAGEMENT', ticker:homeBranding.configured?`Welcome to ${brandingName(homeBranding)} • Results • Updates`:'Live display is awaiting festival setup', show:{results:true,officialLatest:true,recentResults:true,leaderboard:true,announcements:true,media:true,videos:true,logo:true,name:true,subtitle:true,clock:true,ticker:true}, background:{color:'#020617', imageUrl:'', videoUrl:'', slides:[],videos:[]},announcements:['Stay tuned for live updates.'],timing:{resultSeconds:8,revealSeconds:2,leaderboardSeconds:10,slideSeconds:7},interruptPolicy:'after-current', sections:{} });
    const fullscreenRoot = () => document.getElementById('fullscreen-shell') || document.documentElement;
    const fullscreenElement = () => document.fullscreenElement || document.webkitFullscreenElement;
    const setFullscreenLabel = () => { const btn=document.getElementById('fullscreen-toggle'),active=!!fullscreenElement(); if(!btn)return; btn.dataset.active=String(active); btn.setAttribute('aria-pressed',String(active)); btn.textContent=active?'⤢ Exit Full Screen':'⛶ Full Screen'; };
    async function toggleFullscreen(){ const root=fullscreenRoot(),hint=document.getElementById('fullscreen-hint'); try{ if(fullscreenElement()){ if(document.exitFullscreen) await document.exitFullscreen(); else if(document.webkitExitFullscreen) document.webkitExitFullscreen(); } else if(root.requestFullscreen) await root.requestFullscreen({navigationUI:'hide'}); else if(root.webkitRequestFullscreen) root.webkitRequestFullscreen(); else throw new Error('Fullscreen is not supported by this browser.'); }catch(error){ console.warn('TV fullscreen request failed', error); if(hint){hint.textContent='Full screen was blocked. Use the browser menu or F11, then cast the screen.';hint.classList.remove('hidden');setTimeout(()=>hint.classList.add('hidden'),4200);} } finally { setFullscreenLabel(); } }
    document.getElementById('fullscreen-toggle')?.addEventListener('click',toggleFullscreen);
    document.addEventListener('fullscreenchange',setFullscreenLabel);document.addEventListener('webkitfullscreenchange',setFullscreenLabel);document.addEventListener('keydown',event=>{if(event.key?.toLowerCase()==='f'&&!event.metaKey&&!event.ctrlKey&&!event.altKey){toggleFullscreen();}});

    const sectionDefaults={logo:{el:'tv-logo-section',order:1,position:'left'},name:{el:'tv-name-section',order:2,position:'left'},subtitle:{el:'tv-subtitle',order:3,position:'left'},clock:{el:'clock',order:4,position:'right'},ticker:{el:'tv-ticker-section',order:9,position:'bottom'}};
    function applySectionLayout(c){Object.entries(sectionDefaults).forEach(([key,def])=>{const el=document.getElementById(def.el),section=c.sections?.[key]||{},visible=c.show?.[key]!==false&&section.visible!==false;if(!el)return;el.classList.toggle('tv-section-hidden',!visible);el.style.order=String(Number(section.order||def.order));el.classList.remove('tv-pos-left','tv-pos-center','tv-pos-right');if(['left','center','right'].includes(def.position))el.classList.add(`tv-pos-${def.position}`);});const ticker=document.getElementById('tv-ticker-section');if(ticker){ticker.style.order='99';ticker.classList.add('mt-8');ticker.classList.remove('mb-8');}}
    const cfg = () => {const base=defaults(),controlContent=tvControl.content||{},videoUrls=Array.isArray(tvControl.videoUrls)&&tvControl.videoUrls.length?tvControl.videoUrls.filter(Boolean):[tvControl.videoUrl].filter(Boolean);return { title: tvConfig.title || base.title, ticker: tvConfig.ticker || base.ticker, show:{...base.show, ...(tvConfig.show||{}), ...controlContent}, background:{...base.background, ...(tvConfig.background||{})},control:{mode:tvControl.mode||'dashboard',animationStyle:tvControl.animationStyle||'cinematic',selectedResultIds:Array.isArray(tvControl.selectedResultIds)?tvControl.selectedResultIds:[],videoUrls,imageUrls:Array.isArray(tvControl.imageUrls)?tvControl.imageUrls:[],afterQueue:tvControl.afterQueue||'dashboard'},announcements:Array.isArray(tvConfig.announcements)?tvConfig.announcements:base.announcements,timing:{...base.timing,...(tvConfig.timing||{})},interruptPolicy:tvControl.interruptPolicy||tvConfig.interruptPolicy||base.interruptPolicy, sections:{...(base.sections||{}),...(tvConfig.sections||{}),...(tvControl.sections||{})} };};
    const teamName = value => String(teamDisplayNames?.[value] || value || 'Team');
    const animationClass = () => ({spotlight:'scene-spotlight','ticker-rise':'scene-ticker-rise',confetti:'scene-confetti'}[cfg().control.animationStyle] || 'scene-in');
    const resultEvent = r => events.find(e=>e.id===r.eventId)||r;
    const resultType = r => resultEvent(r).type||r.type;
    const resultCancelled = r => resultEvent(r).cancelled===true||r.cancelled===true;
    const groupTeam = id => registrations.find(registration=>registration.id===id)?.team||id;
    const participantForWinner = id => students.find(s=>s.id===id) || participants.find(item=>item.id===id) || students.find(s=>String(s.chestNo||'')===String(id||'')) || students.find(s=>String(s.name||'').trim().toLowerCase()===String(id||'').trim().toLowerCase()) || participants.find(p=>String(p.chestNo||'')===String(id||'')) || participants.find(p=>String(p.name||p.fullName||'').trim().toLowerCase()===String(id||'').trim().toLowerCase()) || null;
    const winnerDetail = (r,id) => r.winnerDetails?.[id] || participantForWinner(id) || {};
    const winnerTeam = (r,id) => resultType(r)==='Group'?(registrations.find(registration=>registration.id===id)?.team||r.winnerDetails?.[id]?.team||id):(winnerDetail(r,id).team||'');
    const publishedResults = () => results.filter(r=>!r.status||r.status==='published');
    const controlledResults = () => {const c=cfg().control;if(!c.selectedResultIds.length)return publishedResults();const order=new Map(c.selectedResultIds.map((id,index)=>[id,index]));return publishedResults().filter(r=>order.has(r.eventId)).sort((a,b)=>order.get(a.eventId)-order.get(b.eventId));};

    function winnerLabel(r) {
      const first = Array.isArray(r.places) ? r.places[0]?.winners?.[0] : (Array.isArray(r.winners?.first) ? r.winners.first[0] : r.winners?.first);
      if(!first) return 'Winner';
      if(resultType(r) === 'Group') return teamName(groupTeam(first));
      return winnerDetail(r,first).name || winnerDetail(r,first).fullName || first;
    }

    const sleep = ms => new Promise(resolve=>setTimeout(resolve,ms));
    const person = id => participantForWinner(id) || {};
    const personName = (r,id) => winnerDetail(r,id).name || winnerDetail(r,id).fullName || id || 'Winner';
    const resultPlaces = r => Array.isArray(r.places)&&r.places.length?r.places.map((p,i)=>({label:p.label||['First','Second','Third'][i]||`Position ${i+1}`,winners:p.winners||[],value:p.earnedValue??p.value??0})):[['first','First'],['second','Second'],['third','Third']].map(([key,label])=>({label,winners:Array.isArray(r.winners?.[key])?r.winners[key]:[r.winners?.[key]].filter(Boolean),value:r.points?.[key]||0})).filter(p=>p.winners.length);
    const eventName = r => events.find(e=>e.id===r.eventId)?.name || r.eventName || 'Event';
    const h = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const eventMeta = r => { const e=resultEvent(r); return {name:eventName(r),category:r.category||e.category||e.section||'General',stage:r.stage||e.stage||e.venue||'Main stage',gender:r.gender||e.gender||'Open',type:resultType(r)||'Individual'}; };
    const timeValue = v => typeof v?.toMillis==='function'?v.toMillis():typeof v?.seconds==='number'?v.seconds*1000:Number(v||0);
    const publishTime = r => timeValue(r.publishedAt||r.updatedAt||r.timestamp);
    const fmtTime = t => t ? new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(new Date(t)) : 'Live';
    const rankTone = i => ['from-yellow-300 to-amber-500 text-slate-950','from-slate-200 to-slate-400 text-slate-950','from-orange-300 to-orange-700 text-white'][i] || 'from-indigo-300 to-blue-500 text-white';
    const placeIcon = i => ['🥇','🥈','🥉'][i] || '🏅';
    const winnerProfiles = (r,place) => (place.winners||[]).map(id => { const profile=person(id),detail=winnerDetail(r,id),isGroup=resultType(r)==='Group',team=teamName(winnerTeam(r,id)),name=isGroup?team:personName(r,id); return {id,profile,isGroup,team,name,photo:detail.photoData||detail.photoUrl||profile.photoData||profile.photoUrl||'',chest:detail.chestNo||profile.chestNo||'-'}; });
    const primaryWinner = r => { const firstPlace=resultPlaces(r)[0]||{winners:[],value:0,label:'Winner'}; return winnerProfiles(r,firstPlace)[0] || {name:winnerLabel(r),team:teamName(winnerTeam(r,(firstPlace.winners||[])[0])),chest:'-',photo:'',profile:{},isGroup:resultType(r)==='Group'}; };
    const sectionOrder=(c,key,fallback)=>Number(c.sections?.[key]?.order||fallback);
    const sectionVisible=(c,key,legacy)=>c.show?.[key]!==false&&c.sections?.[key]?.visible!==false&&(legacy?c.show?.[legacy]!==false:true);
    const resultSequenceEnabled=()=>sectionVisible(cfg(),'officialLatest','results');
    const dashboardLayouts=Object.freeze({officialLatest:{columns:8},leaderboard:{columns:4,compact:true},recentResults:{columns:4},announcements:{columns:4},media:{columns:4,compact:true}});
    const cardAttrs=(key)=>{const layout=dashboardLayouts[key]||{columns:6},compact=layout.compact===true||layout.columns<=4,scale=layout.columns<=4?.78:layout.columns<=6?.88:1;return ` data-tv-compact="${compact}" style="grid-column:span ${layout.columns}/span ${layout.columns};font-size:${scale}em;"`;};
    const metaChips = (m,centered=false) => `<div class="mt-4 flex flex-wrap gap-3 text-sm font-black uppercase tracking-wide text-white/75 ${centered?'justify-center':''}"><span class="rounded-full bg-white/10 px-4 py-2">${h(m.category)}</span><span class="rounded-full bg-white/10 px-4 py-2">${h(m.stage)}</span><span class="rounded-full bg-white/10 px-4 py-2">${h(m.gender)}</span><span class="rounded-full bg-white/10 px-4 py-2">${h(m.type)}</span></div>`;
    function renderHeroResult(r,attrs=''){ if(!r) return `<div${attrs} class="col-span-8 glass rounded-[2rem] p-8 scene-in"><p class="text-sm font-black uppercase tracking-[.35em] text-yellow-300">Official result desk</p><h2 class="mt-5 text-5xl font-black">Awaiting first published result</h2><p class="mt-5 text-xl font-bold text-white/60">Results will appear here automatically as soon as judges publish them.</p></div>`; const m=eventMeta(r),winner=primaryWinner(r),places=resultPlaces(r); return `<div${attrs} class="col-span-8 glass rounded-[2rem] p-7 scene-in overflow-auto relative"><div class="absolute -right-20 -top-20 h-72 w-72 rounded-full bg-yellow-400/20 blur-3xl"></div><div class="relative"><div class="flex items-start justify-between gap-5"><div><p class="text-sm font-black uppercase tracking-[.35em] text-yellow-300">Official latest result</p><h2 class="mt-3 text-5xl font-black leading-tight">${h(m.name)}</h2>${metaChips(m)}</div><span class="rounded-full bg-emerald-400/15 px-5 py-3 text-lg font-black text-emerald-200">${h(fmtTime(publishTime(r)))}</span></div><div class="mt-6 grid grid-cols-[144px_minmax(0,1fr)] gap-5 items-center">${winner.photo?`<img src="${h(winner.photo)}" class="h-36 w-36 rounded-[2rem] object-cover ring-4 ring-yellow-300/60" alt="Winner">`:`<div class="grid h-36 w-36 place-items-center rounded-[2rem] bg-gradient-to-br from-yellow-300 to-amber-600 text-6xl font-black text-slate-950">${h((winner.name||'W').charAt(0))}</div>`}<div><p class="text-xl font-black text-yellow-200">${h(places[0]?.label||'Winner')}</p><h3 class="mt-2 text-5xl font-black leading-none">${h(winner.name)}</h3><p class="mt-4 text-2xl font-bold text-white/75">Chest ${h(winner.chest)} • ${h(winner.team)} • +${h(places[0]?.value||0)} pts</p></div></div></div></div>`; }
    function renderRecentResults(rows,attrs=''){ return `<div${attrs} class="col-span-4 glass rounded-[2rem] p-7"><h2 class="text-3xl font-black text-cyan-200">Recent Results</h2><div class="mt-5 space-y-3">${rows.slice(0,5).map((r,i)=>{const m=eventMeta(r),w=primaryWinner(r);return `<div class="rounded-2xl bg-white/10 p-4"><div class="flex items-center justify-between gap-3"><b class="truncate text-xl">${h(m.name)}</b><span class="rounded-full bg-white/10 px-3 py-1 text-xs font-black">#${i+1}</span></div><p class="mt-2 truncate text-2xl font-black text-white">${h(w.name)}</p><p class="mt-1 text-sm font-bold text-white/55">${h(w.team)} · ${h(m.category)} · ${h(fmtTime(publishTime(r)))}</p></div>`}).join('') || '<p class="rounded-2xl border border-dashed border-white/20 p-8 text-center text-xl font-bold text-white/45">No published results yet</p>'}</div></div>`; }
    function renderLeaderboardCard(limit=8,attrs=''){ const rows=scores().slice(0,limit); return `<div${attrs} class="col-span-4 glass rounded-[2rem] p-8"><div class="flex items-center justify-between"><h2 class="text-4xl font-black text-green-300">Team Standings</h2><span class="rounded-full bg-green-400/10 px-4 py-2 text-sm font-black text-green-200">LIVE</span></div><div class="mt-6 space-y-3">${rows.map((s,i)=>`<div class="flex items-center justify-between rounded-2xl ${i===0?'bg-gradient-to-r from-yellow-300 to-amber-500 text-slate-950':'bg-white/10 text-white'} px-5 py-4 text-3xl font-black"><span>${i===0?'👑 ':''}#${i+1} ${h(teamName(s[0]))}</span><span>${h(s[1])} pts</span></div>`).join('') || '<p class="text-white/50 text-2xl">No team points yet</p>'}</div></div>`; }
    function renderAnnouncement(c,attrs=''){const message=c.announcements[slideIndex%Math.max(1,c.announcements.length)]||'Stay tuned for live updates.',length=message.length,textSize=length>420?'text-xl':length>260?'text-2xl':length>140?'text-3xl':'text-4xl';return `<div${attrs} class="col-span-4 glass rounded-[2rem] p-8"><p class="text-sm font-black uppercase tracking-[.3em] text-blue-200">Announcement</p><p class="mt-4 ${textSize} font-black leading-tight text-white/90">${h(message)}</p></div>`;}
    function renderMediaFocus(attrs=''){ const c=cfg(), media=[...(c.background.slides||[]).map(url=>({type:'image',url})),...(c.show.videos===true?(c.background.videos||[]):[]).map(url=>({type:'video',url}))],item=media[slideIndex%Math.max(1,media.length)]; return `<div${attrs} class="col-span-7 glass rounded-[2rem] p-5"><h2 class="mb-4 text-3xl font-black text-blue-200">Media Wall</h2>${item ? item.type==='video'?(youtubeEmbed(item.url,false)?`<iframe src="${h(youtubeEmbed(item.url,false))}" class="h-[340px] w-full rounded-[1.5rem]" title="YouTube playlist video" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe>`:`<video src="${h(item.url)}" class="h-[340px] w-full rounded-[1.5rem] object-cover" autoplay muted playsinline></video>`):`<img src="${h(item.url)}" class="h-[340px] w-full rounded-[1.5rem] object-cover" alt="slide">` : '<div class="grid h-[340px] place-items-center rounded-[1.5rem] bg-white/10 text-2xl font-black text-white/50">No media configured</div>'}</div>`; }
    const controlPlaylistActive=()=>{const c=cfg();return c.show.videos===true&&['video-only','media'].includes(c.control.mode)&&c.control.videoUrls.length>0;};
    const advanceVideoPlaylist=()=>{if(!controlPlaylistActive())return;slideIndex++;lastDashboardHash='';render();};
    function youtubeEmbed(value,loop=true){try{const url=new URL(value),host=url.hostname.replace(/^www\./,'');let id='';if(host==='youtu.be')id=url.pathname.split('/').filter(Boolean)[0]||'';else if(host==='youtube.com'||host==='m.youtube.com'||host==='music.youtube.com'){if(url.pathname==='/watch')id=url.searchParams.get('v')||'';else if(/^\/(shorts|embed|live)\//.test(url.pathname))id=url.pathname.split('/')[2]||'';}if(!/^[a-zA-Z0-9_-]{6,15}$/.test(id))return '';const query=new URLSearchParams({autoplay:'1',mute:'1',controls:'0',playsinline:'1',rel:'0',modestbranding:'1',enablejsapi:'1',origin:location.origin});if(loop){query.set('loop','1');query.set('playlist',id);}return `https://www.youtube.com/embed/${id}?${query}`;}catch(_){return '';}}
    function scores() {
      const map = {}; teams.forEach(t => map[t] = 0);
      const add = (r, winner, pts) => { const value = Number(pts || 0), team=winnerTeam(r,winner); if(!winner || !value || !team) return; if(map[team]===undefined)map[team]=0;map[team] += value; };
      results.filter(r => (!r.status || r.status === 'published')&&!resultCancelled(r)).forEach(r => {
        if(!eventContributesToTeamScore(events.find(event=>event.id===r.eventId)||r,festSetup))return;
        if(Array.isArray(r.places) || Array.isArray(r.gradeAwards)) {
          (r.places || []).forEach(p => (p.winners || []).forEach(w => add(r, w, p.earnedValue ?? p.value)));
          (r.gradeAwards || []).forEach(g => (g.winners || []).forEach(w => add(r, w, g.value)));
        } else ['first','second','third'].forEach(p => { const arr = Array.isArray(r.winners?.[p]) ? r.winners[p] : [r.winners?.[p]].filter(Boolean); arr.forEach(w => add(r, w, r.points?.[p] || 0)); });
      });
      return Object.entries(map).sort((a,b) => b[1] - a[1]);
    }

    function render() {
      const c = cfg();
      const videoOnly = c.control.mode === 'video-only';
      document.querySelector('main').classList.toggle('hidden', videoOnly);
      document.getElementById('tv-overlay')?.classList.toggle('hidden', videoOnly);
      document.getElementById('tv-title').textContent = c.title;applySectionLayout(c);
      document.getElementById('ticker').textContent = c.ticker;
      const bg = document.getElementById('bg');
      bg.style.background = c.background.imageUrl ? `url('${c.background.imageUrl}') center/cover` : c.background.color;
      const controlMedia = ['video-only','media'].includes(c.control.mode),videoEnabled=c.show.videos===true,playlist=controlMedia&&c.control.videoUrls.length?c.control.videoUrls:[c.background.videoUrl].filter(Boolean),activeVideo=videoEnabled?playlist[slideIndex%Math.max(1,playlist.length)]:'',playlistMode=controlPlaylistActive();const video=document.getElementById('bg-video'),youtube=document.getElementById('bg-youtube'),youtubeUrl=videoEnabled?youtubeEmbed(activeVideo,!playlistMode):'';if(youtubeUrl){video.pause();video.removeAttribute('src');video.classList.add('hidden');if(youtube.dataset.source!==activeVideo){youtube.src=youtubeUrl;youtube.dataset.source=activeVideo;}youtube.classList.remove('hidden');youtube.classList.toggle('opacity-50',!videoOnly);}else if(activeVideo&&videoEnabled){youtube.removeAttribute('src');delete youtube.dataset.source;youtube.classList.add('hidden');video.loop=!playlistMode;if(video.dataset.source!==activeVideo){video.src=activeVideo;video.dataset.source=activeVideo;}video.classList.remove('hidden');video.classList.toggle('opacity-50',!videoOnly);video.play().catch(()=>{});}else{video.pause();video.removeAttribute('src');delete video.dataset.source;video.classList.add('hidden');youtube.removeAttribute('src');delete youtube.dataset.source;youtube.classList.add('hidden');}

      if(videoOnly){bg.style.background = c.control.imageUrls[slideIndex%Math.max(1,c.control.imageUrls.length)] ? `url('${c.control.imageUrls[slideIndex%Math.max(1,c.control.imageUrls.length)]}') center/cover` : '#000';return;}
      const recent = publishedResults().slice().sort((a,b)=>publishTime(b)-publishTime(a));
      const cards = [];
      if(sectionVisible(c,'officialLatest','results')) cards.push({key:'officialLatest',order:sectionOrder(c,'officialLatest',6),html:renderHeroResult(recent[0],cardAttrs('officialLatest'))});
      if(sectionVisible(c,'leaderboard')) cards.push({key:'leaderboard',order:sectionOrder(c,'leaderboard',7),html:renderLeaderboardCard(6,cardAttrs('leaderboard'))});
      if(sectionVisible(c,'recentResults','results')) cards.push({key:'recentResults',order:sectionOrder(c,'recentResults',8),html:renderRecentResults(recent.slice(1),cardAttrs('recentResults'))});
      if(sectionVisible(c,'announcements')) cards.push({key:'announcements',order:sectionOrder(c,'announcements',9),html:renderAnnouncement(c,cardAttrs('announcements'))});
      if(sectionVisible(c,'media')) cards.push({key:'media',order:sectionOrder(c,'media',10),html:renderMediaFocus(cardAttrs('media'))});
      const html=cards.sort((a,b)=>a.order-b.order).map(card=>card.html).join('') || '<div class="col-span-12 glass rounded-[2rem] p-10 text-center text-4xl font-black">No TV sections selected</div>';const hash=html+c.title+c.ticker+JSON.stringify(c.sections);if(hash!==lastDashboardHash&&!presenting){document.getElementById('main-grid').innerHTML=html;lastDashboardHash=hash;}
    }

    function suspendVideos(){const background=document.getElementById('bg-video'),youtube=document.getElementById('bg-youtube');background.pause();background.removeAttribute('src');delete background.dataset.source;youtube.removeAttribute('src');delete youtube.dataset.source;document.querySelectorAll('#main-grid video').forEach(video=>{video.pause();video.removeAttribute('src');});document.querySelectorAll('#main-grid iframe').forEach(frame=>frame.removeAttribute('src'));}
    function winnerCard(profile,place,index,featured=false,sidePodium=false){return `<div class="${featured?'scale-105':sidePodium?'scale-[.85] self-end origin-bottom':''} rounded-[2rem] bg-white/10 p-6 text-center ring-1 ring-white/10"><div class="mx-auto mb-4 grid h-16 w-16 place-items-center rounded-2xl bg-gradient-to-br ${rankTone(index)} text-3xl font-black">${placeIcon(index)}</div>${profile.photo?`<img src="${h(profile.photo)}" class="mx-auto h-36 w-36 rounded-[1.5rem] object-cover" alt="Winner">`:`<div class="mx-auto grid h-36 w-36 place-items-center rounded-[1.5rem] bg-white/10 text-5xl font-black">${h((profile.name||'W').charAt(0))}</div>`}<p class="mt-5 text-2xl font-black uppercase text-yellow-200">${h(place.label)}</p><h3 class="mt-2 text-4xl font-black leading-tight">${h(profile.name)}</h3><p class="mt-3 text-xl font-bold text-white/70">Chest ${h(profile.chest)} • ${h(profile.team)}</p><p class="mt-3 text-3xl font-black text-green-300">+${h(place.value||0)} pts</p></div>`;}
    async function showQueuedResults(){if(presenting||!resultQueue.length||!resultSequenceEnabled())return;presenting=true;suspendVideos();previousScoreMap=Object.fromEntries(scores());const scene=document.getElementById('live-scene'),status=document.getElementById('queue-status');scene.classList.remove('hidden');scene.classList.add('flex');status.classList.remove('hidden');const batch=[...resultQueue];resultQueue.length=0;for(let index=0;index<batch.length;index++){const result=batch[index],places=resultPlaces(result),m=eventMeta(result);status.textContent=`LIVE RESULT ${index+1} / ${batch.length}`;scene.innerHTML=`<section class="${animationClass()} w-full max-w-7xl text-center"><p class="text-2xl font-black uppercase tracking-[.45em] text-red-400">Official Result</p><h2 class="mt-6 text-8xl font-black leading-none">${h(m.name)}</h2>${metaChips(m,true)}<p class="mt-8 text-3xl font-bold text-white/60">Winners reveal starts now</p></section>`;await sleep(1200);for(let p=places.length-1;p>=0;p--){const place=places[p],profiles=winnerProfiles(result,place);scene.innerHTML=`<section class="${animationClass()} w-full max-w-7xl text-center"><p class="text-3xl font-black uppercase tracking-[.2em] text-yellow-300">${h(place.label)} · ${placeIcon(p)}</p><h2 class="mt-4 text-6xl font-black">${h(m.name)}</h2><div class="mt-8 grid gap-5 ${profiles.length>1?'md:grid-cols-2':'place-items-center'}">${profiles.map(profile=>winnerCard(profile,place,p,true)).join('')}</div></section>`;await sleep(Math.max(1,cfg().timing.revealSeconds)*1000);}const podium=places.slice(0,3),ordered=[podium[1],podium[0],podium[2]].filter(Boolean);scene.innerHTML=`<section class="${animationClass()} w-full max-w-7xl"><p class="text-center text-2xl font-black uppercase tracking-[.4em] text-emerald-300">Congratulations</p><h2 class="mt-4 text-center text-7xl font-black">${h(m.name)}</h2><div class="mt-10 grid items-end gap-5 md:grid-cols-3">${ordered.map(place=>winnerCard(winnerProfiles(result,place)[0]||{name:'Winner',team:'Team',chest:'-',photo:''},place,places.indexOf(place),place===podium[0],place!==podium[0])).join('')}</div></section>`;await sleep(Math.max(2,cfg().timing.resultSeconds)*1000);if(resultQueue.length)batch.push(...resultQueue.splice(0));}if(sectionVisible(cfg(),'leaderboard'))await showScoreCount(scene);await showAfterQueue(scene);status.classList.add('hidden');scene.classList.add('hidden');scene.classList.remove('flex');presenting=false;lastDashboardHash='';render();if(resultQueue.length)showQueuedResults();}
    async function showScoreCount(scene){const next=Object.fromEntries(scores()),teamsSorted=Object.entries(next).sort((a,b)=>b[1]-a[1]);scene.innerHTML=`<section class="${animationClass()} w-full max-w-7xl"><p class="text-center text-xl font-black uppercase tracking-[.35em] text-green-200">Live scoreboard</p><h2 class="mb-8 mt-3 text-center text-7xl font-black text-green-300">Team Points Update</h2><div class="grid grid-cols-2 gap-5">${teamsSorted.map(([team,total],i)=>{const before=previousScoreMap[team]||0,delta=total-before;return `<div class="flex items-center justify-between rounded-2xl ${i===0?'bg-gradient-to-r from-yellow-300 to-amber-500 text-slate-950':'bg-white/10 text-white'} p-6 text-3xl font-black"><span>${i===0?'👑 ':''}#${i+1} ${h(teamName(team))}</span><span><b data-score-team="${h(team)}" data-from="${before}" data-to="${total}">${before}</b> <small class="text-lg">${delta>0?`+${delta}`:'—'}</small></span></div>`}).join('')}</div></section>`;const duration=1800,start=performance.now();await new Promise(resolve=>{const tick=now=>{const progress=Math.min(1,(now-start)/duration);scene.querySelectorAll('[data-score-team]').forEach(node=>node.textContent=Math.round(Number(node.dataset.from)+(Number(node.dataset.to)-Number(node.dataset.from))*progress));progress<1?requestAnimationFrame(tick):resolve();};requestAnimationFrame(tick);});await sleep(Math.max(2,cfg().timing.leaderboardSeconds)*1000);previousScoreMap=next;}
    async function showAfterQueue(scene){const mode=cfg().control.afterQueue;if(mode==='leaderboard'&&sectionVisible(cfg(),'leaderboard')){scene.innerHTML=`<section class="${animationClass()} w-full max-w-7xl"><div class="grid grid-cols-12 gap-6">${renderLeaderboardCard(10,cardAttrs('leaderboard'))}</div></section>`;await sleep(Math.max(2,cfg().timing.leaderboardSeconds)*1000);}else if(mode==='media'&&sectionVisible(cfg(),'media')){scene.innerHTML=`<section class="${animationClass()} w-full max-w-7xl"><div class="grid grid-cols-12 gap-6">${renderMediaFocus()}<div class="col-span-5 glass rounded-[2rem] p-8"><p class="text-sm font-black uppercase tracking-[.35em] text-blue-200">Back to media</p><h2 class="mt-5 text-6xl font-black">Festival moments continue</h2></div></div></section>`;await sleep(Math.max(3,cfg().timing.slideSeconds)*1000);}}
    function acceptResults(snapshot){const next=snapshot.docs.map(d=>({eventId:d.id,...d.data()})),published=next.filter(r=>!r.status||r.status==='published'),ids=new Set(published.map(r=>r.eventId));if(resultsReady){const selected=new Set(cfg().control.selectedResultIds||[]);const fresh=published.filter(r=>!knownPublished.has(r.eventId)&&(!selected.size||selected.has(r.eventId))).sort((a,b)=>(a.publishedAt||a.updatedAt||0)-(b.publishedAt||b.updatedAt||0));if(fresh.length){resultQueue.push(...fresh);const delay=cfg().interruptPolicy==='immediate'?0:Math.max(1,cfg().timing.slideSeconds)*1000;setTimeout(showQueuedResults,delay);}}results=next;knownPublished=ids;resultsReady=true;if(!presenting)render();}
    document.getElementById('bg-video').addEventListener('ended',advanceVideoPlaylist);document.getElementById('bg-youtube').addEventListener('load',event=>{if(!controlPlaylistActive())return;event.currentTarget.contentWindow?.postMessage(JSON.stringify({event:'listening',id:1,channel:'widget'}),'https://www.youtube.com');event.currentTarget.contentWindow?.postMessage(JSON.stringify({event:'command',func:'addEventListener',args:['onStateChange']}),'https://www.youtube.com');});window.addEventListener('message',event=>{if(!/https:\/\/(www\.)?youtube\.com$/.test(event.origin))return;try{const data=typeof event.data==='string'?JSON.parse(event.data):event.data;if(data?.event==='onStateChange'&&Number(data.info)===0)advanceVideoPlaylist();}catch(_){}});setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),1000);function rotateMedia(){setTimeout(()=>{if(!controlPlaylistActive()){slideIndex++;if(!presenting){lastDashboardHash='';render();}}rotateMedia();},Math.max(3,cfg().timing.slideSeconds)*1000);}rotateMedia();

    // Public reads are allowed by Firestore rules, so TV config must not wait for anonymous auth.
    // This keeps tv.html updated even when anonymous sign-in is disabled or delayed.
    onSnapshot(doc(db, 'settings', 'tv_config'), s => { tvConfig = s.data() || {}; render(); }, e => console.error('TV config listener failed', e));
    onSnapshot(doc(db, 'settings', 'tv_control'), s => { tvControl = s.data() || {}; lastDashboardHash=''; render(); if(cfg().control.mode==='results'&&resultSequenceEnabled()&&!presenting){resultQueue.push(...controlledResults()); showQueuedResults();} }, e => console.error('TV control listener failed', e));
    onSnapshot(doc(db, 'settings', 'home_config'), s => { homeBranding=normalizeBranding(s.data()||{});applyBase64Image(document.getElementById('tv-fest-logo'),homeBranding.logoUrl,document.getElementById('tv-logo-fallback'));document.title=`${brandingName(homeBranding)} — TV`;render(); }, e => console.error('TV branding listener failed', e));
    onSnapshot(collection(db, 'events'), s => { events = s.docs.map(d => ({id:d.id, ...d.data()})); render(); }, e => console.error('TV events listener failed', e));
    onSnapshot(collection(db, 'students'), s => { students = s.docs.map(d => ({id:d.id, ...d.data()})); render(); }, e => console.error('TV students listener failed', e));
    onSnapshot(collection(db, 'participants'), s => { participants = s.docs.map(d => ({id:d.id, ...d.data()})); render(); }, e => console.error('TV participants listener failed', e));
    onSnapshot(collection(db, 'registrations'), s => { registrations = s.docs.map(d => ({id:d.id, ...d.data()})); render(); }, e => console.error('TV registrations listener failed', e));
    onSnapshot(doc(db, 'settings', 'general'), s => { const data=s.data()||{};teams=data.teams||[];teamDisplayNames=data.teamDisplayNames||{};festSetup=normalizeFestSetup(data.festSetup||{});render(); }, e => console.error('TV general listener failed', e));
    onSnapshot(query(collection(db, 'results'), where('status', '==', 'published')), acceptResults, e => console.error('TV results listener failed', e));
    signInAnonymously(auth).catch(e => console.warn('Anonymous TV sign-in skipped/failed; public listeners continue.', e));
    render();
  </script>
</body>
