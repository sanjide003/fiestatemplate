<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' https: data: blob:; media-src 'self' https: blob:; connect-src 'self' https: wss://*.firebaseio.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Fest TV Display</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Manjari:wght@400;700&display=swap" rel="stylesheet">
  <style>
    html, body { touch-action: pan-x pan-y pinch-zoom; overscroll-behavior: auto; }
    body { font-family: Inter, Manjari, sans-serif; background:#020617; color:#fff; overflow:hidden; }
    @keyframes ticker { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
    .ticker { animation: ticker 26s linear infinite; }
    @keyframes sceneIn{from{opacity:0;transform:scale(.97) translateY(24px)}to{opacity:1;transform:none}}@keyframes spotlight{from{opacity:0;filter:blur(12px);transform:scale(1.1)}to{opacity:1;filter:none;transform:none}}@keyframes tickerRise{from{opacity:0;transform:translateY(80px)}to{opacity:1;transform:none}}@keyframes confettiPop{0%{opacity:0;transform:scale(.6) rotate(-3deg)}70%{transform:scale(1.04) rotate(1deg)}100%{opacity:1;transform:none}}@keyframes scorePulse{50%{transform:scale(1.08);color:#fde047}}.scene-in{animation:sceneIn .55s ease-out both}.scene-spotlight{animation:spotlight .75s ease-out both}.scene-ticker-rise{animation:tickerRise .65s cubic-bezier(.2,.9,.2,1) both}.scene-confetti{animation:confettiPop .8s ease-out both}.score-pulse{animation:scorePulse .7s ease-in-out}.glass { background: rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.16); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="h-screen">
  <div id="bg" class="fixed inset-0 bg-gradient-to-br from-indigo-950 to-black"></div>
  <video id="bg-video" class="fixed inset-0 h-full w-full object-cover hidden opacity-50" autoplay muted loop playsinline></video><iframe id="bg-youtube" class="pointer-events-none fixed inset-0 hidden h-full w-full scale-[1.2] opacity-50" title="YouTube background video" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <div id="tv-overlay" class="fixed inset-0 bg-black/35"></div>

  <main class="relative z-10 h-screen flex flex-col p-10">
    <header class="flex items-center justify-between mb-8">
      <div class="flex items-center gap-5"><div class="h-20 w-20 overflow-hidden rounded-2xl border border-white/20 bg-white/10"><img id="tv-fest-logo" class="hidden h-full w-full object-cover" alt="Fest logo"><span id="tv-logo-fallback" class="flex h-full w-full items-center justify-center text-xl font-black">FM</span></div><div>
        <h1 id="tv-title" class="text-6xl font-black tracking-tight">FEST LIVE</h1>
        <p class="text-white/60 text-xl font-bold mt-2">Live results, standings and announcements</p>
      </div></div>
      <div id="clock" class="text-4xl font-black glass rounded-3xl px-8 py-5"></div>
    </header>

    <section id="main-grid" class="grid grid-cols-12 gap-6 flex-1 min-h-0"></section>

    <div id="live-scene" class="fixed inset-0 z-40 hidden items-center justify-center bg-slate-950/95 p-10"></div>
    <div id="queue-status" class="fixed right-10 top-10 z-50 hidden rounded-full bg-red-600 px-5 py-2 text-lg font-black shadow-2xl"></div>
    <footer class="h-20 mt-8 bg-red-700 overflow-hidden flex items-center rounded-2xl border border-white/10">
      <div id="ticker" class="ticker whitespace-nowrap text-3xl font-black uppercase tracking-wider pl-[100%]">Welcome to Fest Live</div>
    </footer>
  </main>

  <script type="module">
    import { db, auth } from './firebase-config.js';
    import { eventContributesToTeamScore, normalizeFestSetup } from './fest-config.js';
    import { normalizeBranding, brandingName, applyBase64Image } from './branding-config.js';
    import { collection, onSnapshot, doc, query, where } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';
    import { signInAnonymously } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';

    let tvConfig = {}, tvControl = {}, homeBranding=normalizeBranding(), results = [], events = [], students = [], participants = [], registrations = [], teams = [], teamDisplayNames = {}, festSetup = normalizeFestSetup(),resultQueue=[],presenting=false,resultsReady=false,knownPublished=new Set(),previousScoreMap={},lastDashboardHash='',slideIndex=0;
    const defaults = () => ({ title:homeBranding.configured?`${brandingName(homeBranding)} LIVE`:'FEST MANAGEMENT', ticker:homeBranding.configured?`Welcome to ${brandingName(homeBranding)} • Results • Updates`:'Live display is awaiting festival setup', show:{results:true, leaderboard:true, announcements:true, media:true,videos:true}, background:{color:'#020617', imageUrl:'', videoUrl:'', slides:[],videos:[]},announcements:['Stay tuned for live updates.'],timing:{resultSeconds:8,revealSeconds:2,leaderboardSeconds:10,slideSeconds:7},interruptPolicy:'after-current' });
    const cfg = () => {const base=defaults(),controlContent=tvControl.content||{};return { title: tvConfig.title || base.title, ticker: tvConfig.ticker || base.ticker, show:{...base.show, ...(tvConfig.show||{}), ...controlContent}, background:{...base.background, ...(tvConfig.background||{})},control:{mode:tvControl.mode||'dashboard',animationStyle:tvControl.animationStyle||'cinematic',selectedResultIds:Array.isArray(tvControl.selectedResultIds)?tvControl.selectedResultIds:[],videoUrl:tvControl.videoUrl||'',imageUrls:Array.isArray(tvControl.imageUrls)?tvControl.imageUrls:[],afterQueue:tvControl.afterQueue||'dashboard'},announcements:Array.isArray(tvConfig.announcements)?tvConfig.announcements:base.announcements,timing:{...base.timing,...(tvConfig.timing||{})},interruptPolicy:tvControl.interruptPolicy||tvConfig.interruptPolicy||base.interruptPolicy };};
    const teamName = value => String(teamDisplayNames?.[value] || value || 'Team');
    const animationClass = () => ({spotlight:'scene-spotlight','ticker-rise':'scene-ticker-rise',confetti:'scene-confetti'}[cfg().control.animationStyle] || 'scene-in');
    const resultEvent = r => events.find(e=>e.id===r.eventId)||r;
    const resultType = r => resultEvent(r).type||r.type;
    const resultCancelled = r => resultEvent(r).cancelled===true||r.cancelled===true;
    const groupTeam = id => registrations.find(registration=>registration.id===id)?.team||id;
    const winnerTeam = (r,id) => resultType(r)==='Group'?groupTeam(id):(students.find(s=>s.id===id)||participants.find(item=>item.id===id))?.team;
    const controlledResults = () => {const c=cfg().control;if(!c.selectedResultIds.length)return results.filter(r=>!r.status||r.status==='published');const order=new Map(c.selectedResultIds.map((id,index)=>[id,index]));return results.filter(r=>(!r.status||r.status==='published')&&order.has(r.eventId)).sort((a,b)=>order.get(a.eventId)-order.get(b.eventId));};

    function winnerLabel(r) {
      const first = Array.isArray(r.places) ? r.places[0]?.winners?.[0] : (Array.isArray(r.winners?.first) ? r.winners.first[0] : r.winners?.first);
      if(!first) return 'Winner';
      if(resultType(r) === 'Group') return teamName(groupTeam(first));
      return students.find(s => s.id === first)?.name || participants.find(item=>item.id===first)?.name || first;
    }

    const sleep = ms => new Promise(resolve=>setTimeout(resolve,ms));
    const person = id => students.find(s=>s.id===id) || participants.find(p=>p.id===id) || {};
    const personName = id => person(id).name || id || 'Winner';
    const resultPlaces = r => Array.isArray(r.places)&&r.places.length?r.places.map((p,i)=>({label:p.label||['First','Second','Third'][i]||`Position ${i+1}`,winners:p.winners||[],value:p.earnedValue??p.value??0})):[['first','First'],['second','Second'],['third','Third']].map(([key,label])=>({label,winners:Array.isArray(r.winners?.[key])?r.winners[key]:[r.winners?.[key]].filter(Boolean),value:r.points?.[key]||0})).filter(p=>p.winners.length);
    const eventName = r => events.find(e=>e.id===r.eventId)?.name || r.eventName || 'Event';
    function youtubeEmbed(value,loop=true){try{const url=new URL(value),host=url.hostname.replace(/^www\./,'');let id='';if(host==='youtu.be')id=url.pathname.split('/').filter(Boolean)[0]||'';else if(host==='youtube.com'||host==='m.youtube.com'||host==='music.youtube.com'){if(url.pathname==='/watch')id=url.searchParams.get('v')||'';else if(/^\/(shorts|embed|live)\//.test(url.pathname))id=url.pathname.split('/')[2]||'';}if(!/^[a-zA-Z0-9_-]{6,15}$/.test(id))return '';const query=new URLSearchParams({autoplay:'1',mute:'1',controls:'0',playsinline:'1',rel:'0',modestbranding:'1'});if(loop){query.set('loop','1');query.set('playlist',id);}return `https://www.youtube.com/embed/${id}?${query}`;}catch(_){return '';}}
    function scores() {
      const map = {}; teams.forEach(t => map[t] = 0);
      const add = (r, winner, pts) => { const value = Number(pts || 0), team=winnerTeam(r,winner); if(!winner || !value || !team) return; if(map[team] !== undefined) map[team] += value; };
      results.filter(r => (!r.status || r.status === 'published')&&!resultCancelled(r)).forEach(r => {
        if(!eventContributesToTeamScore(events.find(event=>event.id===r.eventId)||r,festSetup))return;
        if(Array.isArray(r.places) || Array.isArray(r.gradeAwards)) {
          (r.places || []).forEach(p => (p.winners || []).forEach(w => add(r, w, p.earnedValue ?? p.value)));
          (r.gradeAwards || []).forEach(g => (g.winners || []).forEach(w => add(r, w, g.value)));
        } else ['first','second','third'].forEach(p => { const arr = Array.isArray(r.winners?.[p]) ? r.winners[p] : [r.winners?.[p]].filter(Boolean); arr.forEach(w => add(r, w, r.points?.[p] || 0)); });
      });
      return Object.entries(map).sort((a,b) => b[1] - a[1]);
    }

    function render() {
      const c = cfg();
      const videoOnly = c.control.mode === 'video-only';
      document.querySelector('main').classList.toggle('hidden', videoOnly);
      document.getElementById('tv-overlay')?.classList.toggle('hidden', videoOnly);
      document.getElementById('tv-title').textContent = c.title;
      document.getElementById('ticker').textContent = c.ticker;
      const bg = document.getElementById('bg');
      bg.style.background = c.background.imageUrl ? `url('${c.background.imageUrl}') center/cover` : c.background.color;
      // legacy smoke marker: c.show.videos?youtubeEmbed
      const controlMedia = ['video-only','media'].includes(c.control.mode),activeVideo = controlMedia&&c.control.videoUrl ? c.control.videoUrl : c.background.videoUrl;const video=document.getElementById('bg-video'),youtube=document.getElementById('bg-youtube'),youtubeUrl=(controlMedia || c.show.videos)?youtubeEmbed(activeVideo):'';if(youtubeUrl){video.pause();video.removeAttribute('src');video.classList.add('hidden');if(youtube.dataset.source!==activeVideo){youtube.src=youtubeUrl;youtube.dataset.source=activeVideo;}youtube.classList.remove('hidden');youtube.classList.toggle('opacity-50',!videoOnly);}else if(activeVideo&&(controlMedia||c.show.videos)){youtube.removeAttribute('src');delete youtube.dataset.source;youtube.classList.add('hidden');if(video.dataset.source!==activeVideo){video.src=activeVideo;video.dataset.source=activeVideo;}video.classList.remove('hidden');video.classList.toggle('opacity-50',!videoOnly);video.play().catch(()=>{});}else{video.pause();video.removeAttribute('src');delete video.dataset.source;video.classList.add('hidden');youtube.removeAttribute('src');delete youtube.dataset.source;youtube.classList.add('hidden');}

      if(videoOnly){bg.style.background = c.control.imageUrls[slideIndex%Math.max(1,c.control.imageUrls.length)] ? `url('${c.control.imageUrls[slideIndex%Math.max(1,c.control.imageUrls.length)]}') center/cover` : '#000';return;}
      const cards = [];
      if(c.show.results) {
        const recent = controlledResults().slice(-5).reverse();
        cards.push(`<div class="col-span-7 glass rounded-[2rem] p-8 min-h-0"><h2 class="text-3xl font-black mb-5 text-yellow-300">Latest Results</h2><div class="space-y-4">${recent.map(r => `<div class="bg-white/10 rounded-2xl p-5"><div class="text-4xl font-black">${winnerLabel(r)}</div><div class="text-xl text-white/70">${events.find(e=>e.id===r.eventId)?.name || r.eventName || 'Event'}</div></div>`).join('') || '<p class="text-white/50 text-2xl">No results yet</p>'}</div></div>`);
      }
      if(c.show.leaderboard) {
        cards.push(`<div class="col-span-5 glass rounded-[2rem] p-8"><h2 class="text-3xl font-black mb-5 text-green-300">Team Points</h2><div class="space-y-3">${scores().slice(0,8).map((s,i) => `<div class="flex justify-between text-3xl font-black bg-white/10 rounded-2xl px-5 py-3"><span>#${i+1} ${teamName(s[0])}</span><span>${s[1]}</span></div>`).join('')}</div></div>`);
      }
      if(c.show.announcements) cards.push(`<div class="col-span-6 glass rounded-[2rem] p-8"><h2 class="text-3xl font-black mb-3 text-blue-300">Announcements</h2><p class="text-3xl font-bold text-white/80">${c.announcements[slideIndex%c.announcements.length]||'Stay tuned for live updates.'}</p></div>`);
      if(c.show.media){const media=[...(c.background.slides||[]).map(url=>({type:'image',url})),...(c.show.videos?(c.background.videos||[]):[]).map(url=>({type:'video',url}))],item=media[slideIndex%Math.max(1,media.length)];if(item)cards.push(`<div class="col-span-6 glass rounded-[2rem] p-4">${item.type==='video'?(youtubeEmbed(item.url,false)?`<iframe src="${youtubeEmbed(item.url,false)}" class="h-[280px] w-full rounded-[1.5rem]" title="YouTube playlist video" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe>`:`<video src="${item.url}" class="h-[280px] w-full rounded-[1.5rem] object-cover" autoplay muted playsinline></video>`):`<img src="${item.url}" class="w-full h-[280px] object-cover rounded-[1.5rem]" alt="slide">`}</div>`);}
      const html=cards.join('') || '<div class="col-span-12 glass rounded-[2rem] p-10 text-center text-4xl font-black">No TV sections selected</div>';const hash=html+c.title+c.ticker;if(hash!==lastDashboardHash&&!presenting){document.getElementById('main-grid').innerHTML=html;lastDashboardHash=hash;}
    }

    function suspendVideos(){const background=document.getElementById('bg-video'),youtube=document.getElementById('bg-youtube');background.pause();background.removeAttribute('src');delete background.dataset.source;youtube.removeAttribute('src');delete youtube.dataset.source;document.querySelectorAll('#main-grid video').forEach(video=>{video.pause();video.removeAttribute('src');});document.querySelectorAll('#main-grid iframe').forEach(frame=>frame.removeAttribute('src'));}
    async function showQueuedResults(){if(presenting||!resultQueue.length)return;presenting=true;suspendVideos();previousScoreMap=Object.fromEntries(scores());const scene=document.getElementById('live-scene'),status=document.getElementById('queue-status');scene.classList.remove('hidden');scene.classList.add('flex');status.classList.remove('hidden');const batch=[...resultQueue];resultQueue.length=0;for(let index=0;index<batch.length;index++){const result=batch[index],places=resultPlaces(result);status.textContent=`LIVE RESULT ${index+1} / ${batch.length}`;scene.innerHTML=`<section class="${animationClass()} w-full max-w-6xl text-center"><p class="text-2xl font-black uppercase tracking-[.3em] text-red-400">Result Published</p><h2 class="mt-5 text-7xl font-black">${eventName(result)}</h2><p class="mt-4 text-2xl text-white/60">Winners reveal</p></section>`;await sleep(1200);for(let p=places.length-1;p>=0;p--){const place=places[p],winnerCards=place.winners.map(id=>{const profile=person(id),photo=profile.photoData||profile.photoUrl||'',isGroup=resultType(result)==='Group',team=isGroup?teamName(groupTeam(id)):teamName(profile.team),displayName=isGroup?team:personName(id);return `<div class='mx-auto mt-5 flex max-w-4xl items-center gap-5 rounded-[2rem] bg-white/10 p-5 text-left'>${photo?`<img src='${photo}' class='h-36 w-36 rounded-[1.5rem] object-cover'>`:`<div class='grid h-36 w-36 place-items-center rounded-[1.5rem] bg-white/10 text-4xl font-black'>${(personName(id)||'W').charAt(0)}</div>`}<div><h2 class='text-6xl font-black'>${displayName}</h2><p class='mt-3 text-3xl font-bold text-white/75'>Chest ${profile.chestNo||'-'} • ${team} • ${place.value||0} pts</p></div></div>`}).join('');scene.innerHTML=`<section class="${animationClass()} w-full max-w-6xl text-center"><p class="text-3xl font-black uppercase text-yellow-300">${place.label}</p>${winnerCards}<p class="mt-6 text-3xl text-white/70">${eventName(result)}${place.value?` • +${place.value} points`:''}</p></section>`;await sleep(Math.max(1,cfg().timing.revealSeconds)*1000);}await sleep(Math.max(2,cfg().timing.resultSeconds-places.length*cfg().timing.revealSeconds)*1000);if(resultQueue.length)batch.push(...resultQueue.splice(0));}await showScoreCount(scene);status.classList.add('hidden');scene.classList.add('hidden');scene.classList.remove('flex');presenting=false;lastDashboardHash='';render();if(resultQueue.length)showQueuedResults();}
    async function showScoreCount(scene){const next=Object.fromEntries(scores()),teamsSorted=Object.entries(next).sort((a,b)=>b[1]-a[1]);scene.innerHTML=`<section class="${animationClass()} w-full max-w-6xl"><h2 class="mb-8 text-center text-6xl font-black text-green-300">Team Points Update</h2><div class="grid grid-cols-2 gap-5">${teamsSorted.map(([team,total],i)=>`<div class="flex items-center justify-between rounded-2xl bg-white/10 p-6 text-3xl font-black"><span>#${i+1} ${teamName(team)}</span><span data-score-team="${team}" data-from="${previousScoreMap[team]||0}" data-to="${total}">${previousScoreMap[team]||0}</span></div>`).join('')}</div></section>`;const duration=1800,start=performance.now();await new Promise(resolve=>{const tick=now=>{const progress=Math.min(1,(now-start)/duration);scene.querySelectorAll('[data-score-team]').forEach(node=>node.textContent=Math.round(Number(node.dataset.from)+(Number(node.dataset.to)-Number(node.dataset.from))*progress));progress<1?requestAnimationFrame(tick):resolve();};requestAnimationFrame(tick);});await sleep(Math.max(2,cfg().timing.leaderboardSeconds)*1000);previousScoreMap=next;}
    function acceptResults(snapshot){const next=snapshot.docs.map(d=>({eventId:d.id,...d.data()})),published=next.filter(r=>!r.status||r.status==='published'),ids=new Set(published.map(r=>r.eventId));if(resultsReady){const selected=new Set(cfg().control.selectedResultIds||[]);const fresh=published.filter(r=>!knownPublished.has(r.eventId)&&(!selected.size||selected.has(r.eventId))).sort((a,b)=>(a.publishedAt||a.updatedAt||0)-(b.publishedAt||b.updatedAt||0));if(fresh.length){resultQueue.push(...fresh);const delay=cfg().interruptPolicy==='immediate'?0:Math.max(1,cfg().timing.slideSeconds)*1000;setTimeout(showQueuedResults,delay);}}results=next;knownPublished=ids;resultsReady=true;if(!presenting)render();}
    setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),1000);function rotateMedia(){setTimeout(()=>{slideIndex++;if(!presenting){lastDashboardHash='';render();}rotateMedia();},Math.max(3,cfg().timing.slideSeconds)*1000);}rotateMedia();

    // Public reads are allowed by Firestore rules, so TV config must not wait for anonymous auth.
    // This keeps tv.html updated even when anonymous sign-in is disabled or delayed.
    onSnapshot(doc(db, 'settings', 'tv_config'), s => { tvConfig = s.data() || {}; render(); }, e => console.error('TV config listener failed', e));
    onSnapshot(doc(db, 'settings', 'tv_control'), s => { tvControl = s.data() || {}; lastDashboardHash=''; render(); if(cfg().control.mode==='results'&&!presenting){resultQueue.push(...controlledResults()); showQueuedResults();} }, e => console.error('TV control listener failed', e));
    onSnapshot(doc(db, 'settings', 'home_config'), s => { homeBranding=normalizeBranding(s.data()||{});applyBase64Image(document.getElementById('tv-fest-logo'),homeBranding.logoUrl,document.getElementById('tv-logo-fallback'));document.title=`${brandingName(homeBranding)} — TV`;render(); }, e => console.error('TV branding listener failed', e));
    onSnapshot(collection(db, 'events'), s => { events = s.docs.map(d => ({id:d.id, ...d.data()})); render(); }, e => console.error('TV events listener failed', e));
    onSnapshot(collection(db, 'students'), s => { students = s.docs.map(d => ({id:d.id, ...d.data()})); render(); }, e => console.error('TV students listener failed', e));
    onSnapshot(collection(db, 'participants'), s => { participants = s.docs.map(d => ({id:d.id, ...d.data()})); render(); }, e => console.error('TV participants listener failed', e));
    onSnapshot(collection(db, 'registrations'), s => { registrations = s.docs.map(d => ({id:d.id, ...d.data()})); render(); }, e => console.error('TV registrations listener failed', e));
    onSnapshot(doc(db, 'settings', 'general'), s => { const data=s.data()||{};teams=data.teams||[];teamDisplayNames=data.teamDisplayNames||{};festSetup=normalizeFestSetup(data.festSetup||{});render(); }, e => console.error('TV general listener failed', e));
    onSnapshot(query(collection(db, 'results'), where('status', '==', 'published')), acceptResults, e => console.error('TV results listener failed', e));
    signInAnonymously(auth).catch(e => console.warn('Anonymous TV sign-in skipped/failed; public listeners continue.', e));
    render();
  </script>
</body>
</html>
