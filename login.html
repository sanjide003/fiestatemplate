<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' https: data: blob:; font-src 'self' https:; connect-src 'self' https: wss://*.firebaseio.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <title>Fest Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Manjari:wght@100;400;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@1.25.0"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-900 flex items-center justify-center p-4" style="font-family: Inter, Manjari, sans-serif;">
  <div id="login-transition" class="fixed inset-0 z-[100] hidden items-center justify-center bg-white">
    <div class="text-center">
      <div class="relative mx-auto h-28 w-28">
        <div class="absolute inset-0 animate-spin rounded-full border-4 border-slate-100 border-t-indigo-600"></div>
        <div class="absolute inset-2 overflow-hidden rounded-full border border-slate-200 bg-white p-1 shadow-xl">
          <img data-fest-logo class="absolute inset-1 z-10 hidden rounded-full object-cover" alt="Fest logo">
          <div data-logo-fallback class="flex h-full w-full items-center justify-center rounded-full bg-indigo-50 text-2xl font-black text-indigo-600">F</div>
        </div>
      </div>
      <p id="transition-fest-name" class="mt-5 text-lg font-black text-slate-900">Fest</p>
      <p class="mt-1 text-xs font-bold uppercase tracking-[0.25em] text-slate-400">Loading</p>
    </div>
  </div>
  <main class="w-full max-w-md bg-white rounded-[2rem] shadow-2xl border border-white/20 overflow-hidden">
    <section class="bg-gradient-to-br from-indigo-600 to-purple-700 p-7 text-center text-white">
      <div class="relative mx-auto mb-4 h-20 w-20 overflow-hidden rounded-full border-2 border-white/40 bg-white p-1 shadow-xl">
        <img data-fest-logo class="absolute inset-1 z-10 hidden rounded-full object-cover" alt="Fest logo">
        <div data-logo-fallback class="flex h-full w-full items-center justify-center rounded-full bg-white/15 text-2xl font-black">F</div>
      </div>
      <h1 id="login-fest-name" class="text-2xl font-black tracking-tight">Fest</h1>
    </section>

    <form id="standalone-login-form" class="p-7 space-y-5">
      <div class="space-y-2">
        <label for="login-identifier" class="text-xs font-black uppercase tracking-widest text-slate-500">Username / Email</label>
        <input id="login-identifier" type="text" autocomplete="username" class="min-h-12 w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm font-semibold outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100" placeholder="admin or admin@example.com" required>
      </div>
      <div class="space-y-2">
        <label for="login-password" class="text-xs font-black uppercase tracking-widest text-slate-500">Password</label>
        <div class="relative">
          <input id="login-password" type="password" autocomplete="current-password" class="min-h-12 w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 pr-12 text-sm font-semibold outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100" placeholder="••••••••" required>
          <button id="login-toggle-password" type="button" aria-label="Show password" class="absolute right-2 top-1/2 -translate-y-1/2 rounded-xl p-2 text-slate-400 hover:bg-white hover:text-indigo-600"><i data-eye-icon data-lucide="eye" class="w-5 h-5"></i></button>
        </div>
      </div>
      <p id="login-error" class="min-h-[1.25rem] text-sm font-bold text-red-600"></p>
      <button id="login-button" type="submit" class="min-h-12 w-full rounded-2xl bg-indigo-600 py-3.5 text-sm font-black text-white shadow-xl shadow-indigo-500/30 transition hover:bg-indigo-700 active:scale-[0.98] flex items-center justify-center gap-2">
        <i data-lucide="log-in" class="w-5 h-5"></i><span data-login-label>Login</span>
      </button>
    </form>
  </main>

  <script type="module" src="./login.js"></script>
</body>
</html>
